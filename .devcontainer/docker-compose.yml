version: "3.8"

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - ../:/workspaces/order-book-engine
    environment:
      PYTHONPATH: /workspaces/order-book-engine/src
    depends_on:
      - redis

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
